name: Hop Aero
description: >-
  Hop Aero is a Y Combinator (Summer 2026) aerospace and defense company based in Los Angeles,
  California, founded in 2024 by Jacob Balaj and Matija Milenovic. The company develops hypersonic
  rocket cargo vehicles that deliver payloads point-to-point into austere, contested environments
  hundreds of miles away in minutes, aiming to give the United States and its allies an asymmetric
  logistics advantage. Hop Aero has raised a $3M pre-seed round and won a $1.25M U.S. Air Force SBIR
  award; its team draws on experience from SpaceX, Virgin Orbit, Masten Space Systems, SpinLaunch,
  and Destinus. This is a hardware-stage company with no public API or developer surface at the time
  of profiling; this record was added to the API Evangelist network as a portfolio-lead stub and is
  maintained for network discovery and enrichment.
